[workspace]
resolver = "2"
members = [
    "crates/lean-canonicalizer",
    "crates/lean-vdb",
    "crates/lean-repl",
    "crates/lean-sys1-ort",
    "crates/lean-prover",
]

[workspace.package]
version = "1.14.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/steveSujo/sheaf"
authors = ["Steve Sujo Pulikottil"]
description = "Token-saving Lean 4 MCP server and local CPU-only prover with persistent lean --server, ONNX routing, SQ8 HNSW retrieval, and kernel verification"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
