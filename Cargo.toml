[workspace]
resolver = "2"
members = [
    "crates/lean-canonicalizer",
    "crates/lean-vdb",
    "crates/lean-repl",
    "crates/lean-sys1-ort",
    "crates/lean-prover",
]

[workspace.package]
version = "0.15.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/local/leanProof"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
